name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Types, lint (incl. hardcoded strings), i18n, OCR tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Fails on any user-facing literal in a component (i18next/no-literal-string).
      - run: npm run lint
      - run: npm run check:i18n
      # OCR parsers: slip (rate × litres = amount, one-digit repair) and certificate expiry.
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder

  rls:
    name: RLS verified with real accounts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start Supabase and apply migrations
        run: npm run db:start
      - name: Generated types match the migrations
        run: |
          npx supabase gen types typescript --local > /tmp/types.ts
          npx prettier --stdin-filepath src/lib/database.types.ts < /tmp/types.ts | diff - src/lib/database.types.ts
      - name: Owner B and a driver cannot see owner A's data
        run: |
          eval "$(npx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=' | sed 's/^/export /')"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
          SUPABASE_SECRET_KEY="$SECRET_KEY" \
          npx tsx scripts/verify-rls.ts
